<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in &mdash; StratScreen</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="navbar">
  <div class="brand"><a href="index.html" style="color:#fff;text-decoration:none;">Strat<span>Screen</span></a></div>
  <nav><a href="register.html">Sign up</a></nav>
</div>

<div class="narrow">
  <div class="auth-card">
    <h2>Log in</h2>
    <div id="form-error" class="form-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password" />
      </div>
      <button type="submit" class="btn full">Log in</button>
    </form>
    <div class="auth-switch">New here? <a href="register.html">Create a free account</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
