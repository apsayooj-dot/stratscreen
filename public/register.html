<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up &mdash; StratScreen</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="navbar">
  <div class="brand"><a href="index.html" style="color:#fff;text-decoration:none;">Strat<span>Screen</span></a></div>
  <nav><a href="login.html">Log in</a></nav>
</div>

<div class="narrow">
  <div class="auth-card">
    <h2>Create your free account</h2>
    <div id="form-error" class="form-error"></div>
    <form id="register-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <button type="submit" class="btn full">Sign up</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<!-- Firebase (compat SDK - no build step required) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
