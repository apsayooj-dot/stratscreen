name: Fetch live index & stock prices (Yahoo Finance)

# Runs every 15 minutes during approx. NSE/BSE market hours on weekdays
# (03:00-10:59 UTC = 08:30-16:29 IST, a buffer around the 09:15-15:30 IST
# trading session). Updates index charts (7 timeframes, 1D through Max) and
# live stock prices for all tracked symbols, then deploys directly.
#
# NOTE: pushes made with the built-in GITHUB_TOKEN do NOT cascade-trigger
# other workflows (incl. deploy-hosting.yml) - that's a deliberate GitHub
# anti-recursion rule, not a bug - so this workflow deploys itself instead
# of relying on that push to do it.
on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-live-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch index charts (Yahoo Finance)
        run: node scripts/fetchIndices.js

      - name: Fetch live stock prices (Yahoo Finance)
        run: node scripts/fetchLivePrices.js
        continue-on-error: true # don't block index charts if stocks.json isn't seeded yet

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/indices.json public/data/stocks.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "Update live prices ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Write service account credentials
        if: steps.commit.outputs.changed == 'true'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ runner.temp }}/firebase-sa.json"

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: firebase deploy --only hosting --project stratscreen --non-interactive
