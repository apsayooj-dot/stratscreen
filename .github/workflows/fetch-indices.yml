name: Fetch daily index closes (Nifty 50 / Bank Nifty / Sensex)

on:
  schedule:
    # 12:35 UTC = 18:05 IST, after NSE/BSE market close on weekdays
    - cron: '35 12 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and append today's index closes
        run: node scripts/fetchIndices.js
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/indices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily index data ($(date -u +%Y-%m-%d))"
            git push
          fi
